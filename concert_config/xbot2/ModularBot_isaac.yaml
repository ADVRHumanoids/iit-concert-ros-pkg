# Stable xbot2 configuration for Concert robot with Isaac Lab simulation.
#
# Usage:
#   xbot2-core -C ModularBot_isaac.yaml -H isaac
#
# Prerequisites:
#   1. Isaac Lab must be running with concert_isaac/run_sim.py
#   2. robot_description topics must be published by concert_xbot2_shell.sh
#   3. Socket at /tmp/.xbot2_isaac/xbot2_isaac_server.sock must be accessible
#
# This is the stable Isaac bringup profile:
#   - URDF/SRDF come from ROS2 topics
#   - ros2_io and ros2_control are enabled
#   - homing and omnisteering are enabled for the validated Isaac flow
#
# The zmq_hal plugin discovers joints from Isaac automatically.
# This Isaac profile follows the Kyon xbot2 pattern:
#   - URDF/SRDF come from ROS2 topics
#   - the robot model uses Pinocchio
#   - Isaac discovery provides the runtime joint names

XBotInterface:
    urdf: ros2 run xbot2_ros topic_echo /robot_description
    srdf: ros2 run xbot2_ros topic_echo /robot_description_semantic

ModelInterface:
    model_type: pin


xbotcore_device_configs:
    isaac: $PWD/../hal/ModularBot_isaac.yaml


xbotcore_threads:
    rt_main:  {sched: fifo, prio: 60, period: 0.001}
    nrt_main: {sched: other, prio: 0, period: 0.005}


xbotcore_plugins:
    homing:
        thread: rt_main
        type: homing
        params:
            time:
                type: double
                value: 5.0
            # NOTE: the Concert homing target comes from the committed deployment
            # SRDF at concert_isaac/assets/srdf/ModularBot.srdf.

    ros_io: {thread: nrt_main, type: ros2_io}
    ros_control: {thread: nrt_main, type: ros2_control, params: {autostart: true}}
    omnisteering:
        thread: nrt_main
        type: omnisteering_controller_plugin
        params:
            wheel_names: [wheel_A, wheel_B, wheel_C, wheel_D]
            wheel_radius: [0.16, 0.16, 0.16, 0.16]
            vel_offset_gain: 1.0


xbotcore_param:
    /xbot/hal/joint_safety/filter_autostart: {value: true, type: bool}
    /xbot/hal/joint_safety/filter_cutoff_hz: {value: 2.0, type: double}
    /xbot/hal/enable_safety: {value: false, type: bool}
    /xbot/trigger_safety_on_shutdown: {value: false, type: bool}
