    joint_impedance_control: 
        thread: nrt_control
        type: joint_impedance_controlH
        params:
            robot_task_config_file: {value: $(rospack find robots)/robots/concert/configs/vim/robotTaskSettings/robot_task_config_concert.yaml, type: file}
            im_engine_config_file: {value: $(rospack find robots)/robots/concert/configs/vim/vimSettings/vim_config_concert.yaml, type: file}
            plugin_settings_config_file: {value: $(rospack find robots)/robots/concert/configs/vim/pluginSettings/plugin_config_concert.yaml, type: file}
            target_topic: {value: /target_pose, type: string}
            robot_topic: {value: /robot_feedback, type: string}
            contact_detection_topic: {value: /contact_notifier, type: string}
            external_wrench_topic: {value: /external_wrench, type: string}

    move_arm:
        thread: nrt_control
        type: targetSender
        params:
          task_name: {value: [arm_control], type: vector<string>} # as in cartesio stack
          task_pose: {value: [1.06549,-0.0284177,0.605787,0.488314,-0.509643,0.510056,-0.491586], type: vector<double>} # arm  
          task_wrench: {value: [0.0,0.0,0.0,10.0,10.0,10.0], type: vector<double>}
          task_desired_error: {value: [0.01,0.05,0.01,0.1,0.1,0.1], type: vector<double>}
          task_time: {value: [20.0], type: vector<double>}
          error_modulation_mode: {value: 1.0, type: double} # 0:exp-1:distance_driven
          wrench_modulation_mode: {value: 1.0, type: double} # 0:exp-1:not implemented yet feedback
          contact_driven: {value: 0.0, type: double} # 0:false-1:true
          target_elements: {value: 7.0, type: double}
          n_targets: {value: 1.0, type: double}
          loop_targets: {value: 0.0, type: double}
          are_degrees: {value: 0.0, type: double}
          topic_name: {value: /target_pose, type: string}

xbotcore_param:
    /xbot/hal/joint_safety/filter_autostart: {value: true, type: bool}
    /xbot/hal/joint_safety/filter_cutoff_hz: {value: 2.0, type: double}
    /xbot/trigger_safety_on_shutdown:
        value: false
        type: bool
